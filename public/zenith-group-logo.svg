  </g>
  
  <!-- ZENITH in serif font -->
  <text x="125" y="80" font-family="Cinzel, Garamond, Baskerville, Times New Roman, serif" font-size="64" font-weight="700" letter-spacing="16" fill="#111827">ZENITH</text>
  
  <!-- GROUP in clean sans-serif font -->
  <text x="215" y="112" font-family="Montserrat, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="18" fill="#111827">GROUP</text>
</svg>